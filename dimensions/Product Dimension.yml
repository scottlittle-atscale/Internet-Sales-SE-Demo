unique_name: Product Dimension
object_type: dimension
label: Product Dimension
description: Product Line, category, and Name
hierarchies:
  - unique_name: Product Dimension
    label: Product Hierarchy
    folder: Product Attributes
    levels:
      - unique_name: Product Line
      - unique_name: Product Category
        secondary_attributes:
          - unique_name: Product Subcategory ID
            label: Product Subcategory ID
            description: ID of the product category
            dataset: dimproduct
            key_columns:
              - productsubcategorykey
            name_column: productsubcategorykey
      - unique_name: Product Name
        metrics:
          - unique_name: List Price
            label: List Price
            description: >-
              Suggested retail price / MSRP of the product in dollars from the
              product master. Catalog price, not the actual transaction price
              (see Last Product Unit Price).
            calculation_method: sum
            column: listprice
            dataset: dimproduct
            folder: Product Metrics
level_attributes:
  - unique_name: Product Category
    label: Product Category
    description: Product Sub category
    dataset: dimproduct
    key_columns:
      - productline
      - productsubcategorykey
    name_column: productsubcategoryname
  - unique_name: Product Line
    label: Product Line
    description: Product Line
    dataset: dimproduct
    key_columns:
      - productline
    name_column: productline
  - unique_name: Product Name
    label: Product Name
    description: Full Product Name
    dataset: dimproduct
    is_unique_key: true
    key_columns:
      - productkey
    name_column: englishproductname
type: standard
