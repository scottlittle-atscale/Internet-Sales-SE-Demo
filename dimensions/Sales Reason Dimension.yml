unique_name: Sales Reason Dimension
object_type: dimension
label: Sales Reason Dimension
description: >-
  Reasons customers gave for purchasing (e.g. Price, On Promotion, Review)
  grouped by reason type. Joined many-to-many to sales via the hidden Sales
  Reason Bridge.
hierarchies:
  - unique_name: Sales Reason Hierarchy
    label: Sales Reason Hierarchy
    description: >-
      Purchase reason rollup Reason Type > Sales Reason (e.g. Marketing >
      Television Advertisement).
    filter_empty: 'yes'
    folder: Sales Reason
    levels:
      - unique_name: Reason Type
      - unique_name: Sales Reason
level_attributes:
  - unique_name: Reason Type
    label: Reason Type
    description: >-
      Category / type of purchase reason (e.g. Marketing, Promotion, Other).
      Parent level of Sales Reason.
    dataset: dimsalesreason
    key_columns:
      - salesreasonreasongroup
    name_column: salesreasonreasongroup
    sort_column: salesreasonreasongroup
  - unique_name: Sales Reason
    label: Sales Reason
    description: >-
      Specific reason a customer gave for a purchase (e.g. Price, On Promotion,
      Review). Leaf level under Reason Type.
    dataset: dimsalesreason
    is_unique_key: true
    key_columns:
      - salesreasonkey
    name_column: salesreasonname
    sort_column: salesreasonname
type: standard
